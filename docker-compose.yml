name: storefront

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__ConnectionString: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Cors__AllowedOrigins__0: http://localhost:${STOREFRONT_PORT:-5173}
      Cors__AllowedOrigins__1: http://localhost:${ADMIN_PORT:-5174}
      # The public address of the shop, for the addresses in /sitemap.xml.
      Site__Url: ${SITE_URL:-http://localhost:${STOREFRONT_PORT:-5173}}
      # Where uploaded product images are kept (decision 0018). Empty until set in .env: only uploading fails then.
      ImageStorage__Endpoint: ${IMAGE_STORAGE_ENDPOINT:-}
      ImageStorage__Region: ${IMAGE_STORAGE_REGION:-}
      ImageStorage__Bucket: ${IMAGE_STORAGE_BUCKET:-}
      ImageStorage__AccessKey: ${IMAGE_STORAGE_ACCESS_KEY:-}
      ImageStorage__SecretKey: ${IMAGE_STORAGE_SECRET_KEY:-}
      # Email (decision 0031). Locally the messages go to Mailpit and are read at http://localhost:8025. An empty
      # EMAIL_HOST in .env turns sending off (messages are skipped with a warning in the log).
      Email__Host: ${EMAIL_HOST-mailpit}
      Email__Port: ${EMAIL_PORT:-1025}
      Email__User: ${EMAIL_USER:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-shop@example.test}
      Email__UseTls: ${EMAIL_USE_TLS:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # A local mail catcher: takes every message and sends nothing out. Read the messages at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  storefront:
    build:
      context: src/web
      dockerfile: docker/Dockerfile
      args:
        APP: storefront
    environment:
      API_URL: http://localhost:${API_PORT:-8080}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      # The public address of the shop (canonical addresses, sitemap). Search engines are kept out unless ALLOW_INDEXING is true.
      SITE_URL: ${SITE_URL:-http://localhost:${STOREFRONT_PORT:-5173}}
      # nginx forwards /sitemap.xml to the API at this address (inside Docker the API is "api", not "localhost").
      SITEMAP_UPSTREAM: http://api:8080
      ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
    ports:
      - "${STOREFRONT_PORT:-5173}:8080"
    depends_on:
      - api

  admin:
    build:
      context: src/web
      dockerfile: docker/Dockerfile
      args:
        APP: admin
    environment:
      API_URL: http://localhost:${API_PORT:-8080}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      # nginx forwards /api/ here, so the session cookie belongs to the panel address (decision 0014).
      API_UPSTREAM: http://api:8080
    ports:
      - "${ADMIN_PORT:-5174}:8080"
    depends_on:
      - api

volumes:
  db-data:
