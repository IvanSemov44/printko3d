# Demo environment on render.com (fake data, no real payments). See "Демо в render.com" in README.md.
# No secrets here: the database password comes from the database itself, and the public addresses of the
# services are entered once in the render.com dashboard (sync: false), because one service cannot read
# another one's public address.
databases:
  - name: printko3d-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: printko3d-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    # Deploy from main once its GitHub checks have passed.
    autoDeployTrigger: checksPass
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Demo
      - key: PORT
        value: "8080"
      - key: Database__Url
        fromDatabase:
          name: printko3d-db
          property: connectionString
      # The public address of the storefront, for the addresses in /sitemap.xml (the same as SITE_URL of the storefront).
      - key: Site__Url
        sync: false
      # The public addresses of the storefront and the admin panel, for example https://printko3d-storefront.onrender.com
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Cors__AllowedOrigins__1
        sync: false
      # Where uploaded product images are kept (decision 0018). Enter them in the dashboard; the two keys are secrets.
      - key: ImageStorage__Endpoint
        sync: false
      - key: ImageStorage__Region
        sync: false
      - key: ImageStorage__Bucket
        sync: false
      - key: ImageStorage__AccessKey
        sync: false
      - key: ImageStorage__SecretKey
        sync: false

  - type: web
    name: printko3d-storefront
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./src/web/docker/Dockerfile
    dockerContext: ./src/web
    envVars:
      # Render passes environment variables to the Docker build as build arguments.
      - key: APP
        value: storefront
      - key: PORT
        value: "8080"
      # The public address of the API, for example https://printko3d-api.onrender.com
      - key: API_URL
        sync: false
      # The public address that the images are read from (decision 0011), the same in the shop and in the panel.
      - key: IMAGE_BASE_URL
        sync: false
      # The public address of the shop, for canonical addresses and robots.txt. ALLOW_INDEXING is not set here: the demo is kept
      # out of search engines.
      - key: SITE_URL
        sync: false

  - type: web
    name: printko3d-admin
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./src/web/docker/Dockerfile
    dockerContext: ./src/web
    envVars:
      - key: APP
        value: admin
      - key: PORT
        value: "8080"
      - key: API_URL
        sync: false
      - key: IMAGE_BASE_URL
        sync: false
      # The same public address of the API. nginx forwards /api/ to it, so the browser talks only to the panel
      # and the session cookie belongs to one site (decision 0014).
      - key: API_UPSTREAM
        sync: false
