# Weekly dependency updates. Minor and patch updates of one ecosystem come as one pull request;
# a major update is its own pull request. Every pull request goes through the same CI and review as any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The EF tool must match the EF Core packages (.NET 10); raise it together with them.
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker
    directory: /src/backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker
    directory: /src/web/docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
