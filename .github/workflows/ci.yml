name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore Storefront.slnx
      # Warnings are errors via TreatWarningsAsErrors in Directory.Build.props.
      - run: dotnet build Storefront.slnx --no-restore
      - run: dotnet format Storefront.slnx --verify-no-changes --no-restore
      # Fails when the entities and configurations changed but the migration for it is missing (B25).
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/backend/Storefront.Infrastructure --no-build
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - run: dotnet test Storefront.slnx --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: src/backend/Dockerfile
            build-args: ""
          - name: storefront
            context: src/web
            file: src/web/docker/Dockerfile
            build-args: APP=storefront
          - name: admin
            context: src/web
            file: src/web/docker/Dockerfile
            build-args: APP=admin
    name: docker (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only: nothing is pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: NuGet vulnerabilities (fails on High or Critical)
        run: |
          dotnet restore Storefront.slnx
          dotnet list Storefront.slnx package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -E '\b(High|Critical)\b' nuget-audit.txt; then
            echo "::error::NuGet packages with High or Critical vulnerabilities found"
            exit 1
          fi
      - name: npm production dependencies (fails on high or critical)
        working-directory: src/web
        run: npm audit --omit=dev --audit-level=high
      - name: npm dev dependencies (informational)
        working-directory: src/web
        run: npm audit || true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: ./gitleaks git --redact --verbose --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: ./gitleaks git --redact --verbose
